---
layout: default
---
<article class="note">
  <a class="note__back" href="{{ '/#writeups' | relative_url }}">← back to field notes</a>
  <header class="note__header">
    <p class="note__meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>{% if page.categories.size > 0 %} · {{ page.categories | join: " · " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="note__content">{{ content }}</div>
</article>
