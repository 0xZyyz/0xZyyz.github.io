<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"><i></i><i></i><i></i></div>

    <header class="nav">
      <div class="nav__inner">
        <a class="nav__brand" href="{{ '/' | relative_url }}"><span class="nav__logo" aria-hidden="true">🔱</span> Zyyz</a>
        <nav class="nav__links" aria-label="Site sections">
          <a href="#about">about</a>
          <a href="#arsenal">arsenal</a>
          <a href="#engagements">engagements</a>
          <a href="#achievements">achievements</a>
          <a href="#writeups">field-notes</a>
          <a href="#contact">contact</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
          <span class="theme-toggle__icon" id="theme-toggle-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    {{ content }}

    <footer class="footer">
      <span>© {{ site.time | date: "%Y" }} <b>🔱 Zyyz</b> — Mohamed Aziz Rahmouni</span>
      <span>crafted with jekyll · styled after butterfly · <a href="https://github.com/Zyyz2" target="_blank" rel="noopener">github</a></span>
    </footer>

    <script>
      (function () {
        var KEY = 'zyyz-theme';
        var root = document.documentElement;
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (stored !== 'light' && prefersDark)) root.dataset.theme = 'dark';

        var icon = document.getElementById('theme-toggle-icon');
        function sync() {
          if (icon) icon.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
        }
        sync();
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          root.dataset.theme = next;
          try { localStorage.setItem(KEY, next); } catch (e) {}
          sync();
        });
      })();
    </script>
  </body>
</html>
