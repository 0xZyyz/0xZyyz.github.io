<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% include head-custom.html %}
  </head>
  <body>
    <div class="scanline" aria-hidden="true"></div>

    <header class="route">
      <a class="route__self" href="{{ '/' | relative_url }}">zyyz@arch:~$</a>
      <nav class="route__hops" aria-label="Site sections">
        <a href="#about">about</a>
        <span class="hop">&gt;</span>
        <a href="#arsenal">arsenal</a>
        <span class="hop">&gt;</span>
        <a href="#engagements">engagements</a>
        <span class="hop">&gt;</span>
        <a href="#achievements">achievements</a>
        <span class="hop">&gt;</span>
        <a href="#writeups">field-notes</a>
        <span class="hop">&gt;</span>
        <a href="#contact">contact</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <span class="theme-toggle__led" id="theme-toggle-led" aria-hidden="true"></span>
        <span id="theme-toggle-label">theme</span>
      </button>
    </header>

    {{ content }}

    <footer class="footer">
      <span>© {{ site.time | date: "%Y" }} Zyyz</span>
      <span>arch forever · jekyll-powered · <a href="{% if site.github.repository_url %}{{ site.github.repository_url }}{% else %}https://github.com/{{ site.author.github }}/{{ site.title }}.github.io{% endif %}">source</a></span>
    </footer>

    <script>
      (function () {
        var KEY = 'zyyz-theme';
        var root = document.documentElement;
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (e) {}
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (stored === 'light' || (stored !== 'dark' && prefersLight)) root.dataset.theme = 'light';

        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var next = root.dataset.theme === 'light' ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem(KEY, next); } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
