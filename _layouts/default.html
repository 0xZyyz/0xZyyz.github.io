<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% assign og_img = '/assets/icons/og.png' | absolute_url %}
    <meta property="og:image" content="{{ og_img }}">
    <meta property="og:image:secure_url" content="{{ og_img }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mohamed Aziz Rahmouni - Zyyz personal blog">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/icons/favicon-64.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>
  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot__inner">
        <svg class="boot__arch" viewBox="0 0 24 24">
          <path d="M11.392 0c.347.276 1.222 1.613 1.693 2.191a7.9 7.9 0 0 0-.056 15.713 11.698 11.698 0 0 1 .105-2.034 5.86 5.86 0 0 1-6.16-8.906c1.653-1.75 6.354-3.417 7.479-2.115-1.183-3.022-1.918-4.958-1.918-5.537C12.172 1.585 12.222 1.11 12.7 0Zm3.46 6.077c.214 1.907.807 5.05 1.437 6.784.567 1.562 1.009 1.988 1.009 2.5 0 .808-.743 1.79-1.2 1.79-.335 0-.48-.257-.63-.835-.225-.874-.34-2.471-.877-3.587-1.262 2.516-2.696 3.303-3.977 3.303-1.698 0-2.853-1.568-2.853-3.297 0-3.89 4.22-4.854 6.09-7.657Z"/>
        </svg>
        <div class="boot__title">Zyyz - Personal blog</div>
      </div>
    </div>

    <header class="waybar" id="waybar">
      <a class="waybar__logo" href="{{ '/' | relative_url }}" aria-label="Zyyz · home">
        <svg class="waybar__arch" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.392 0c.347.276 1.222 1.613 1.693 2.191a7.9 7.9 0 0 0-.056 15.713 11.698 11.698 0 0 1 .105-2.034 5.86 5.86 0 0 1-6.16-8.906c1.653-1.75 6.354-3.417 7.479-2.115-1.183-3.022-1.918-4.958-1.918-5.537C12.172 1.585 12.222 1.11 12.7 0Zm3.46 6.077c.214 1.907.807 5.05 1.437 6.784.567 1.562 1.009 1.988 1.009 2.5 0 .808-.743 1.79-1.2 1.79-.335 0-.48-.257-.63-.835-.225-.874-.34-2.471-.877-3.587-1.262 2.516-2.696 3.303-3.977 3.303-1.698 0-2.853-1.568-2.853-3.297 0-3.89 4.22-4.854 6.09-7.657Z"/></svg>
        <span>Zyyz</span>
      </a>
      <nav class="waybar__nav" aria-label="Site sections">
        <a href="#about">About</a>
        <a href="#arsenal">Arsenal</a>
        <a href="#experience">Experience</a>
        <a href="#achievements">Achievements</a>
        <a href="#posts">Posts</a>
      </nav>
      <div class="waybar__right">
        <button type="button" class="waybar__mod waybar__btn" id="waybar-wifi" title="Speedtest" aria-label="Run speedtest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <span class="waybar__clock" id="waybar-clock" aria-label="Clock">--:--</span>
      </div>
    </header>

    <div class="waybar-toast" id="waybar-toast" role="status" aria-live="polite">
      <div class="waybar-toast__head" aria-hidden="true">
        <span class="waybar-toast__prompt">$</span> speedtest --simple<span class="waybar-toast__cursor">▌</span>
      </div>
      <div class="waybar-toast__row">
        <span class="waybar-toast__key">ping</span>
        <span class="waybar-toast__ascii" id="speed-bar-ping" aria-hidden="true"></span>
        <span class="waybar-toast__val" id="speed-ping">—</span>
      </div>
      <div class="waybar-toast__row">
        <span class="waybar-toast__key">download</span>
        <span class="waybar-toast__ascii" id="speed-bar-down" aria-hidden="true"></span>
        <span class="waybar-toast__val" id="speed-down">—</span>
      </div>
      <div class="waybar-toast__row">
        <span class="waybar-toast__key">upload</span>
        <span class="waybar-toast__ascii" id="speed-bar-up" aria-hidden="true"></span>
        <span class="waybar-toast__val" id="speed-up">—</span>
      </div>
      <div class="waybar-toast__foot" id="speed-foot"></div>
    </div>

    {{ content }}

    <script>
      (function () {
        var clock = document.getElementById('waybar-clock');
        var wifi = document.getElementById('waybar-wifi');
        var toast = document.getElementById('waybar-toast');
        var pingEl = document.getElementById('speed-ping');
        var downEl = document.getElementById('speed-down');
        var upEl = document.getElementById('speed-up');
        var barPing = document.getElementById('speed-bar-ping');
        var barDown = document.getElementById('speed-bar-down');
        var barUp = document.getElementById('speed-bar-up');
        var foot = document.getElementById('speed-foot');

        if (clock) {
          function tick() {
            clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
          tick();
          setInterval(tick, 15000);
        }

        var wm = document.getElementById('wm-cmd');
        if (wm) {
          var cmd = '"hyperland".replace("e","")';
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce) {
            wm.textContent = cmd;
          } else {
            var wi = 0;
            setTimeout(function type() {
              wm.textContent = cmd.slice(0, ++wi);
              if (wi < cmd.length) setTimeout(type, 55 + Math.random() * 45);
            }, 1400);
          }
        }

        function runSpeedtest() {
          if (!toast) return;
          var dl = 35 + Math.random() * 45;
          var up = 12 + Math.random() * 28;
          var ping = 15 + Math.round(Math.random() * 25);
          var t0 = performance.now();

          toast.classList.add('is-visible');
          toast.classList.remove('is-done');
          foot.textContent = '';
          [pingEl, downEl, upEl].forEach(function (el) {
            el.classList.remove('is-final');
            el.textContent = '—';
          });
          [barPing, barDown, barUp].forEach(function (b) { b.textContent = ''; });

          var SEGS = 12;
          function asciiBar(n) {
            return '\u2588'.repeat(n) + '\u2591'.repeat(SEGS - n);
          }

          function phase(el, barEl, target, dur, unit, isInt, next) {
            var keyEl = el.parentNode.querySelector('.waybar-toast__key');
            keyEl.classList.add('is-active');
            var t0 = performance.now();
            function step(now) {
              var p = Math.min(1, (now - t0) / dur);
              var n = Math.round(p * SEGS);
              barEl.textContent = asciiBar(n);
              el.textContent = isInt ? Math.round(p * target) : (p * target).toFixed(1);
              if (p < 1) {
                requestAnimationFrame(step);
              } else {
                barEl.textContent = '';
                keyEl.classList.remove('is-active');
                el.textContent = (isInt ? Math.round(target) : target.toFixed(1)) + unit;
                el.classList.add('is-final');
                next();
              }
            }
            requestAnimationFrame(step);
          }

          phase(pingEl, barPing, ping, 700, ' ms', true, function () {
            phase(downEl, barDown, dl, 1500, ' Mbps', false, function () {
              phase(upEl, barUp, up, 1300, ' Mbps', false, function () {
                foot.textContent = 'done in ' + ((performance.now() - t0) / 1000).toFixed(1) + 's';
                toast.classList.add('is-done');
                setTimeout(function () {
                  toast.classList.remove('is-visible');
                }, 1600);
              });
            });
          });
        }

        if (wifi) wifi.addEventListener('click', runSpeedtest);

        var boot = document.getElementById('boot');
        if (boot) {
          setTimeout(function () { boot.classList.add('is-hidden'); }, 850);
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 1500);
        }
      })();
    </script>
  </body>
</html>
