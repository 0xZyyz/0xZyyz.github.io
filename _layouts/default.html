<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>
  <body>
    <header class="waybar" id="waybar">
      <a class="waybar__logo" href="{{ '/' | relative_url }}" aria-label="Zyyz — home">
        <svg class="waybar__arch" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M11.392 0c.347.276 1.222 1.613 1.693 2.191a7.9 7.9 0 0 0-.056 15.713 11.698 11.698 0 0 1 .105-2.034 5.86 5.86 0 0 1-6.16-8.906c1.653-1.75 6.354-3.417 7.479-2.115-1.183-3.022-1.918-4.958-1.918-5.537C12.172 1.585 12.222 1.11 12.7 0Zm3.46 6.077c.214 1.907.807 5.05 1.437 6.784.567 1.562 1.009 1.988 1.009 2.5 0 .808-.743 1.79-1.2 1.79-.335 0-.48-.257-.63-.835-.225-.874-.34-2.471-.877-3.587-1.262 2.516-2.696 3.303-3.977 3.303-1.698 0-2.853-1.568-2.853-3.297 0-3.89 4.22-4.854 6.09-7.657Z"/></svg>
        <span>Zyyz</span>
      </a>
      <nav class="waybar__nav" aria-label="Site sections">
        <a href="#about">About</a><span class="waybar__dot" aria-hidden="true">·</span>
        <a href="#arsenal">Arsenal</a><span class="waybar__dot" aria-hidden="true">·</span>
        <a href="#experience">Experience</a><span class="waybar__dot" aria-hidden="true">·</span>
        <a href="#achievements">Achievements</a><span class="waybar__dot" aria-hidden="true">·</span>
        <a href="#writeups">Writeups</a>
      </nav>
      <div class="waybar__right">
        <button type="button" class="waybar__mod waybar__btn" id="waybar-wifi" title="Speedtest" aria-label="Run speedtest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" class="waybar__mod waybar__btn" id="waybar-kb" title="Switch layout" aria-label="Switch keyboard layout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/><line x1="18" y1="10" x2="18" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="6" y1="14" x2="6" y2="13"/></svg>
          <span class="waybar__key" id="waybar-kb-label">EN</span>
        </button>
        <span class="waybar__clock" id="waybar-clock" aria-label="Clock">--:--</span>
      </div>
    </header>

    <div class="waybar-toast" id="waybar-toast" role="status" aria-live="polite">
      <span class="waybar-toast__label" id="speed-label">speedtest</span>
      <span class="waybar-toast__bar"><i id="speed-bar"></i></span>
      <span class="waybar-toast__val" id="speed-val">—</span>
    </div>

    {{ content }}

    <nav class="dockbar" id="dockbar" aria-label="Launcher">
      <span class="dockbar__prompt" aria-hidden="true">❯</span>
      <a href="#about">home</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="#arsenal">arsenal</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="#experience">experience</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="#achievements">achievements</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="#writeups">writeups</a>
      <span class="dockbar__sep" aria-hidden="true"></span>
      <a href="https://github.com/Zyyz2" target="_blank" rel="noopener">github</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="https://medium.com/@Zyyz" target="_blank" rel="noopener">medium</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="https://www.linkedin.com/in/azizrahmouni/" target="_blank" rel="noopener">linkedin</a><span class="dockbar__dot" aria-hidden="true">·</span>
      <a href="mailto:mohamedaziz.rahmouni@insat.ucar.tn">email</a>
    </nav>

    <script>
      (function () {
        var clock = document.getElementById('waybar-clock');
        var kb = document.getElementById('waybar-kb');
        var kbLabel = document.getElementById('waybar-kb-label');
        var wifi = document.getElementById('waybar-wifi');
        var toast = document.getElementById('waybar-toast');
        var bar = document.getElementById('speed-bar');
        var val = document.getElementById('speed-val');
        var label = document.getElementById('speed-label');

        if (clock) {
          function tick() {
            clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
          tick();
          setInterval(tick, 15000);
        }

        if (kb && kbLabel) {
          var layouts = ['EN', 'FR'];
          var li = 0;
          kb.addEventListener('click', function () {
            li = (li + 1) % layouts.length;
            kbLabel.textContent = layouts[li];
          });
        }

        function runSpeedtest() {
          if (!toast) return;
          toast.classList.add('is-visible');
          toast.classList.remove('is-done');
          label.textContent = 'speedtest';
          bar.style.width = '0%';
          val.textContent = '0.0';
          var dl = 75 + Math.random() * 110;
          var up = 20 + Math.random() * 50;
          var ping = 4 + Math.round(Math.random() * 30);
          var t0 = performance.now();
          var dur = 1800;
          function step(now) {
            var p = Math.min(1, (now - t0) / dur);
            bar.style.width = (p * 100) + '%';
            val.textContent = (p * dl).toFixed(1);
            if (p < 1) {
              requestAnimationFrame(step);
            } else {
              bar.style.width = '100%';
              label.textContent = 'download';
              val.textContent = dl.toFixed(1) + ' Mbps';
              toast.classList.add('is-done');
              setTimeout(function () {
                label.textContent = 'upload';
                val.textContent = up.toFixed(1) + ' Mbps';
              }, 1100);
              setTimeout(function () {
                label.textContent = 'ping';
                val.textContent = ping + ' ms';
              }, 2300);
              setTimeout(function () {
                toast.classList.remove('is-visible');
              }, 3600);
            }
          }
          requestAnimationFrame(step);
        }

        if (wifi) wifi.addEventListener('click', runSpeedtest);
      })();
    </script>
  </body>
</html>
